name: CI

on:
  push:
    branches: [main]        # which branch?

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # which version do you use locally?
      - run: python -m compileall src tests   # which folder holds your code?